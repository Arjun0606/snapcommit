# Supabase project config — committed to source control.
# Get your project_id from the Supabase dashboard URL.
project_id = "snapcommit"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://snapcommit.com"
additional_redirect_urls = ["https://snapcommit.com/auth/callback"]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false

# We use Supabase's built-in auth-email sender, which routes through their
# Resend partnership. No separate SMTP setup required for local dev.

[functions]
enabled = true

[edge_runtime]
enabled = true
inspector_port = 8083
